name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build · lint · test
    runs-on: macos-15
    timeout-minutes: 30

    env:
      # 결정적 빌드 — runner image 변동에 흔들리지 않게 명시 고정
      IOS_SIMULATOR_DEVICE: iPhone 16
      IOS_SIMULATOR_OS: "18.6"

    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew (xcodegen, swiftlint)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
            /usr/local/Cellar/swiftlint
          key: brew-${{ runner.os }}-xcodegen-swiftlint-v1

      - name: Install xcodegen + swiftlint
        run: |
          brew install xcodegen swiftlint
          echo "xcodegen $(xcodegen --version)"
          echo "swiftlint $(swiftlint --version)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint (strict — warning은 error로 처리)
        run: swiftlint lint --strict

      - name: Privacy Manifest 검증 (plist syntax + xcodeproj 리소스 포함)
        # App Store 업로드 블로커 — PrivacyInfo.xcprivacy가 깨지거나 빌드에서 빠지면 거부.
        # plutil로 plist 문법 검증 + xcodeproj에 리소스로 포함됐는지 grep.
        run: |
          plutil -lint Unse/PrivacyInfo.xcprivacy
          if ! grep -q "PrivacyInfo.xcprivacy" Unse.xcodeproj/project.pbxproj; then
            echo "❌ PrivacyInfo.xcprivacy 가 Unse.xcodeproj/project.pbxproj 에 포함되지 않음"
            exit 1
          fi
          echo "✅ PrivacyInfo.xcprivacy lint OK + 리소스 포함 확인"

      - name: Build
        run: |
          xcodebuild \
            -project Unse.xcodeproj \
            -scheme Unse \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

      - name: Test
        # Phase 2-1: AppDelegate에 isRunningTests 가드 추가로 host app launch 시
        # FirebaseApp.configure skip → CI에서도 안전. host-less target은 Firebase 모듈
        # link 의존성 때문에 작동 안 했음 (시도 후 회귀).
        run: |
          xcodebuild test \
            -project Unse.xcodeproj \
            -scheme Unse \
            -destination "platform=iOS Simulator,name=${IOS_SIMULATOR_DEVICE},OS=${IOS_SIMULATOR_OS}" \
            -skipPackagePluginValidation
