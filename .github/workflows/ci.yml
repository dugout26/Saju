name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build · lint · test
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios

    env:
      # 결정적 빌드 — runner image 변동에 흔들리지 않게 명시 고정
      IOS_SIMULATOR_DEVICE: iPhone 16
      IOS_SIMULATOR_OS: "18.6"

    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew (xcodegen, swiftlint)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
            /usr/local/Cellar/swiftlint
          key: brew-${{ runner.os }}-xcodegen-swiftlint-v1

      - name: Install xcodegen + swiftlint
        run: |
          brew install xcodegen swiftlint
          echo "xcodegen $(xcodegen --version)"
          echo "swiftlint $(swiftlint --version)"

      - name: Generate Xcode project
        run: xcodegen generate

      # SPM 의존성 캐시 — Firebase, Supabase, Kakao SDK의 fetch + compile 산출물 재사용.
      # cold run에서 1-3분 잡아먹는 dependency resolve/build를 캐시 적중 시 ~10s로 단축.
      # invalidation key: packages 정의가 있는 project.yml + xcodegen이 갱신하는 Package.resolved.
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Unse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: SwiftLint (strict — warning은 error로 처리)
        run: swiftlint lint --strict

      - name: Privacy Manifest 검증 (plist syntax + xcodeproj 리소스 포함)
        # App Store 업로드 블로커 — PrivacyInfo.xcprivacy가 깨지거나 빌드에서 빠지면 거부.
        # plutil로 plist 문법 검증 + xcodeproj에 리소스로 포함됐는지 grep.
        run: |
          plutil -lint Unse/PrivacyInfo.xcprivacy
          if ! grep -q "PrivacyInfo.xcprivacy" Unse.xcodeproj/project.pbxproj; then
            echo "❌ PrivacyInfo.xcprivacy 가 Unse.xcodeproj/project.pbxproj 에 포함되지 않음"
            exit 1
          fi
          echo "✅ PrivacyInfo.xcprivacy lint OK + 리소스 포함 확인"

      - name: Build
        run: |
          xcodebuild \
            -project Unse.xcodeproj \
            -scheme Unse \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

      - name: Test
        # Phase 2-1: AppDelegate에 isRunningTests 가드 추가로 host app launch 시
        # FirebaseApp.configure skip → CI에서도 안전. host-less target은 Firebase 모듈
        # link 의존성 때문에 작동 안 했음 (시도 후 회귀).
        run: |
          xcodebuild test \
            -project Unse.xcodeproj \
            -scheme Unse \
            -destination "platform=iOS Simulator,name=${IOS_SIMULATOR_DEVICE},OS=${IOS_SIMULATOR_OS}" \
            -skipPackagePluginValidation

  edge-functions:
    name: Edge Functions tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test
        run: deno test --no-check supabase/functions/

  android:
    name: Android build · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: detekt (baseline 적용)
        run: ./gradlew :app:detekt

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
