# 하루결 Android detekt config
# iOS SwiftLint 등가 — minimal config, default rules 활용.
#
# 1인 프로젝트 framing 금지 (MEMORY.md) — production iOS 앱 기준 룰 적용.

build:
  maxIssues: 0  # 첫 통과 후 0으로 freeze. 추가 violation은 CI fail.
  weights:
    complexity: 2
    LongParameterList: 1

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 20
  CyclomaticComplexMethod:
    threshold: 20

style:
  MagicNumber:
    active: false   # Compose dp 값 다수 — 룰 off
  ReturnCount:
    active: false   # early return Kotlin 스타일
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']   # @Preview 함수는 IDE에서만 호출 (Android Studio Preview)

naming:
  FunctionNaming:
    functionPattern: "[a-zA-Z][a-zA-Z0-9]*"  # Compose 함수 PascalCase 허용
  ConstructorParameterNaming:
    parameterPattern: "[a-z][A-Za-z0-9]*"

empty-blocks:
  EmptyFunctionBlock:
    active: false   # Compose preview empty body 허용
