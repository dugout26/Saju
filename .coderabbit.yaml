language: ko-KR
early_access: false
tone_instructions: |
  한국어로 간결하게. 추측하지 말고 코드 근거로 말해.
  Karpathy 4원칙(Think Before Coding / Simplicity First / Surgical Changes / Goal-Driven) 위반 시 명시적으로 지적.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

  # 1인 프로젝트 + 한국어 자연어 docstring 활용 → CodeRabbit의 JSDoc 형식 detector가
  # 정확히 인식 안 함. strict 80% threshold는 비실용적이라 비활성.
  pre_merge_checks:
    docstrings:
      mode: off
    # CLAUDE.md §6.5 Conventional Commits 강제 (warning — 차단은 아님)
    title:
      mode: warning
      requirements: |
        Conventional Commits 형식: <type>(<scope?>): <한국어 요약 한 줄>
        type: feat | fix | refactor | chore | docs | test | style | perf | build | ci
        예: "feat(chat): streaming 재시도 추가"
    description:
      mode: warning

  # iOS 프로젝트의 SwiftLint와 동기화 — 명시적 활성으로 룰 적용 보장.
  tools:
    swiftlint:
      enabled: true

  # CLAUDE.md §6.5 Issue 라벨 정책. CodeRabbit이 PR 변경 영역에 따라 자동 부착.
  # auto_apply_labels는 false 유지 — 사용자가 검토 후 수동 부착.
  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
    - label: blocker
      instructions: App Store 제출 거부 / production 데이터 손실 위험이 있는 변경.
    - label: security
      instructions: 인증·결제·secrets·PII·RLS·암호화 관련 변경.
    - label: monitoring
      instructions: Crashlytics·Analytics·Performance·로깅·알람 관련 변경.
    - label: compliance
      instructions: Privacy manifest·ATT·약관·개인정보 처리방침 등 법적 / 정책 준수.
    - label: enhancement
      instructions: 신규 기능 추가 또는 기존 기능 개선.
    - label: bug
      instructions: 재현 가능한 결함 수정.
    - label: tech-debt
      instructions: 동작 변경 없는 리팩토링, 데드코드 제거, 구조 개선.

  path_filters:
    - "!**/*.xcodeproj/**"
    - "!**/.build/**"
    - "!**/DerivedData/**"
    - "!**/*.pbxproj"
    - "!Unse/Assets.xcassets/**"
    - "!**/Pods/**"

  path_instructions:
    - path: "Unse/Core/Saju/**"
      instructions: |
        만세력 도메인. 순수 value type만 (struct/enum). 외부 I/O · 네트워크 · UI 의존 절대 금지.
        Sendable. 부록 B 케이스를 깰 수 있는 변경은 UnseTests에 회귀 케이스 추가 후 PR.

    - path: "Unse/Core/Network/**"
      instructions: |
        APIClient는 actor. DTO는 struct + Sendable. SwiftData @Model을 DTO 자리에 넘기는 코드는 차단(data race).
        Edge Function URL은 Endpoint enum으로만. base URL은 Info.plist에서 읽음 — 하드코딩 X.

    - path: "Unse/Core/Storage/**"
      instructions: |
        SwiftData @Model은 class, Sendable 아님. actor 경계 넘기지 말 것.
        Repository 패턴 유지. ViewModel이 직접 ModelContext 접근 X (가능하면 Repository 경유).

    - path: "Unse/Core/DesignSystem/**"
      instructions: |
        디자인 토큰 정의 영역. Color/spacing/typography 토큰만 추가.
        Color(hex:) 직접 사용은 이 폴더 안에서만 허용.

    - path: "Unse/Features/**"
      instructions: |
        MV(VM) 패턴. View는 UI만, 도메인 로직은 ViewModel(@Observable @MainActor)로 분리.
        Color.ink1 / Color.lavender 같은 디자인 토큰만 사용. hex 직접 사용 금지(brand 컬러 예외 명시 시).
        Spacing.sm/md/lg/xl 토큰만. 매직 넘버 패딩 금지.
        ViewModel을 글로벌 싱글턴으로 만들지 말 것.

    - path: "Unse/Auth/**"
      instructions: |
        Apple/Kakao OAuth → Supabase Auth 통합. 토큰은 Keychain만, UserDefaults 금지.
        nonce/idToken 검증 누락 차단. Supabase JWT는 access/refresh 분리 보관.

    - path: "Unse/Subscription/**"
      instructions: |
        StoreKit 2 + 서버 영수증 검증. 클라 단독 영수증 검증 금지(spoof 방지).

    - path: "Unse/Push/**"
      instructions: |
        APNs/FCM 토큰 등록은 backend로만. 토큰을 로깅·분석 이벤트에 포함 금지(PII).

    - path: "supabase/functions/**"
      instructions: |
        Deno + TypeScript. SUPABASE_SERVICE_ROLE_KEY 노출 금지(로깅·response body에 포함 X).
        CORS preflight (OPTIONS) 처리 필수.
        사용자 호출 함수는 _shared/auth.ts의 getUserId로 JWT 검증 후 진행.
        OPENAI_API_KEY 등 외부 키는 Deno.env에서만 읽고 응답에 노출 금지.
        admin SDK(service_role)는 인증 검증 직후에만 사용.

    - path: "supabase/migrations/**"
      instructions: |
        모든 테이블에 RLS 활성 + user_id 기반 정책. RLS 누락된 신규 테이블은 reject.
        파괴적 마이그레이션(drop column/table)은 별도 PR로 분리하고 명시.

    - path: "**/*.swift"
      instructions: |
        Swift 6 strict concurrency 가정.
        - UI 상태: @MainActor + @Observable
        - I/O 상태: actor
        - 직렬화 데이터: struct + Sendable 명시
        - nonisolated 남용 금지 — 진짜 격리 불필요한 함수에만
        - SwiftData @Model을 Sendable로 처리하는 코드는 즉시 reject

chat:
  auto_reply: true

# Cross-project 누수 방지 — learning은 이 repo 안에서만 사용.
knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

# CodeRabbit 자동 생성 docstring을 한국어로.
code_generation:
  docstrings:
    language: ko-KR
