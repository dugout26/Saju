name: Unse
options:
  bundleIdPrefix: kr.mound
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  xcodeVersion: "16.0"

packages:
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: "2.22.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "11.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: 63HCVR9YH2
    CODE_SIGN_STYLE: Automatic

targets:
  Unse:
    type: application
    platform: iOS
    sources:
      - path: Unse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.mound.unse
        INFOPLIST_FILE: Unse/Info.plist
        CODE_SIGN_ENTITLEMENTS: Unse/Unse.entitlements
        DEVELOPMENT_ASSET_PATHS: '"Unse/Preview Content"'
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: KakaoSDK
        product: KakaoSDKCommon
      - package: KakaoSDK
        product: KakaoSDKAuth
      - package: KakaoSDK
        product: KakaoSDKUser
      - package: Supabase
        product: Supabase
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebasePerformance
    preBuildScripts:
      - script: |
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which swiftlint > /dev/null; then
            swiftlint --quiet
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  UnseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: UnseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.mound.unse.widget
        INFOPLIST_FILE: UnseWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: UnseWidget/UnseWidget.entitlements
    dependencies:
      - target: Unse

  UnseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnseTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.mound.unse.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Unse

schemes:
  Unse:
    build:
      targets:
        Unse: all
        UnseWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnseTests
    profile:
      config: Release
    archive:
      config: Release
